<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home · CATION</title>
  <meta name="description" content="The CATION student dashboard: your learning path, what to do next, and your learning rhythm.">
  <meta name="theme-color" content="#07080a">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="home" href="../index.html">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/base.css?v=20261030-16">
  <link rel="stylesheet" href="../assets/css/app.css?v=20261102-4">
  <script type="module" src="../assets/js/app/main.js?v=20261102-4"></script>
</head>
<body class="app">
  <svg class="defs" width="0" height="0" aria-hidden="true">
    <linearGradient id="q-light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9d78b"/><stop offset="0.45" stop-color="#f0ebdf"/><stop offset="1" stop-color="#7c87dd"/></linearGradient>
  </svg>
  <a class="skip-link" href="#main">Skip to the dashboard</a>

  <!-- The student application: a rail of navigation and one view at a time (assets/js/app/shell.js routes between
       them by the address's #/ path). Home is the learning path beside the Learning Rhythm rail. Everything about the
       learner is sample data (assets/js/app/data/sample-learner.js), and the page says so at the top right. -->
  <div class="app-shell">
    <nav class="app-nav" aria-label="Application">
      <a class="app-logo" href="../index.html" aria-label="CATION website">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M21.51 9.49A8.5 8.5 0 1 0 21.51 21.51" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="21.51" cy="21.51" r="2.4" fill="var(--gold)" stroke="none"/></svg>
        <svg class="word" viewBox="0 0 140 22" aria-hidden="true"><path d="M19.29 3.01A11.3 11.3 0 1 0 19.29 18.99M27.5 22 38 0 48.5 22M30.6 15.5h14.8M49 0h19M58.5 0v22M79 0v22M123 22V0l17 22V0"/><circle cx="103" cy="11" r="11.3"/></svg>
      </a>
      <ul class="app-nav-list">
        <li><a class="nav-item" href="#/" data-route="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg><span>Home</span></a></li>
        <li><a class="nav-item" href="#/learning" data-route="learning">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5 12 4l8 3.5-8 3.5z"/><path d="m4 12 8 3.5 8-3.5"/><path d="m4 16.5 8 3.5 8-3.5"/></svg><span>My Learning</span></a></li>
        <li><a class="nav-item" href="../explore/index.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m15.4 8.6-2 4.8-4.8 2 2-4.8z"/></svg><span>Explore</span></a></li>
        <li><button type="button" class="nav-item" data-search-open aria-haspopup="dialog" aria-keyshortcuts="Meta+K Control+K /">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.5 4.5"/></svg><span>Search</span></button></li>
        <li><button type="button" class="nav-item nav-q" data-q-open aria-haspopup="dialog">
          <svg class="q-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11.5" cy="11" r="7"/><path d="m13.6 13.6 5.4 5.6"/></svg><span>Q</span></button></li>
      </ul>
    </nav>

    <div class="app-main">
      <div class="app-tools">
        <span class="sample-chip" title="No accounts, lessons or assessments exist yet. Progress and activity shown here are sample data.">Prototype · sample data</span>
        <div class="tool" data-menu>
          <button type="button" class="avatar" id="me" aria-label="Your account" aria-haspopup="true"></button>
          <div class="popover account" id="account" hidden></div>
        </div>
      </div>

      <main id="main" tabindex="-1">
        <noscript><p class="noscript">The dashboard needs JavaScript. The <a href="../explore/index.html">course catalogue</a> works without it.</p></noscript>

        <div class="view home" data-view="home">
          <div class="journey-col">
            <h1 class="greeting">Welcome back.</h1>
            <section class="journey" id="journey" aria-labelledby="journey-title"></section>
          </div>
          <aside class="side" id="rhythm" aria-label="Learning rhythm"></aside>
          <section class="more" id="more" aria-labelledby="more-title"></section>
        </div>

        <div class="view page" data-view="learning" hidden></div>
        <div class="view page" data-view="settings" hidden></div>
      </main>
    </div>
  </div>

  <!-- Search opens over the page from the rail, ⌘K or Ctrl+K, or /. -->
  <div class="search-layer" id="search-layer" role="dialog" aria-modal="true" aria-label="Search" hidden>
    <div class="search-box">
      <div class="search" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.5 4.5"/></svg>
        <input id="search" type="search" placeholder="Search courses, chapters and subjects, or ask Q…" autocomplete="off" spellcheck="false"
          role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" aria-label="Search the catalogue or ask Q">
        <kbd class="search-key" aria-hidden="true">Esc</kbd>
      </div>
      <div class="search-results" id="search-results" role="listbox" aria-label="Search results"></div>
    </div>
  </div>

  <!-- Q, CATION's teaching assistant. Not connected to any AI service yet: the panel says so and sends nothing. -->
  <div class="q-panel" id="q-panel" role="dialog" aria-modal="false" aria-labelledby="q-title" hidden>
    <div class="q-head">
      <svg class="q-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11.5" cy="11" r="7"/><path d="m13.6 13.6 5.4 5.6"/></svg>
      <div>
        <h2 id="q-title">Q</h2>
        <p>Teaching assistant · prototype</p>
      </div>
      <button type="button" class="icon-btn" data-q-close aria-label="Close Q"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </div>
    <div class="q-body" id="q-body"></div>
  </div>
</body>
</html>
